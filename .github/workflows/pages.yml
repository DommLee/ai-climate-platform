name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  smoke-gate:
    runs-on: ubuntu-latest
    env:
      API_BASE_FROM_VAR: ${{ vars.VITE_API_BASE_URL }}
      API_BASE_FROM_SECRET: ${{ secrets.VITE_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install smoke dependencies
        run: pip install requests

      - name: Resolve API base url
        id: resolve
        shell: bash
        run: |
          sanitize_api_base() {
            case "$1" in
              ""|"VITE_API_BASE_URL"|"undefined"|"null")
                echo ""
                ;;
              *)
                echo "$1"
                ;;
            esac
          }

          API_BASE_FROM_SECRET="$(sanitize_api_base "$API_BASE_FROM_SECRET")"
          API_BASE_FROM_VAR="$(sanitize_api_base "$API_BASE_FROM_VAR")"
          API_BASE_URL="${API_BASE_FROM_SECRET:-$API_BASE_FROM_VAR}"

          if [ -z "$API_BASE_URL" ]; then
            echo "::error::VITE_API_BASE_URL is not configured. Smoke gate cannot run."
            exit 1
          fi
          echo "api_base_url=$API_BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Run API smoke tests
        run: python scripts/smoke_api.py --base-url "${{ steps.resolve.outputs.api_base_url }}"

  build:
    runs-on: ubuntu-latest
    needs: smoke-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend for Pages
        working-directory: frontend
        env:
          VITE_BASE_PATH: /ai-climate-platform/
          VITE_ROUTER_MODE: hash
          VITE_API_BASE_URL_VAR: ${{ vars.VITE_API_BASE_URL }}
          VITE_API_BASE_URL_SECRET: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          sanitize_api_base() {
            case "$1" in
              ""|"VITE_API_BASE_URL"|"undefined"|"null")
                echo ""
                ;;
              *)
                echo "$1"
                ;;
            esac
          }

          VITE_API_BASE_URL_SECRET="$(sanitize_api_base "$VITE_API_BASE_URL_SECRET")"
          VITE_API_BASE_URL_VAR="$(sanitize_api_base "$VITE_API_BASE_URL_VAR")"

          if [ -n "$VITE_API_BASE_URL_SECRET" ]; then
            export VITE_API_BASE_URL="$VITE_API_BASE_URL_SECRET"
          elif [ -n "$VITE_API_BASE_URL_VAR" ]; then
            export VITE_API_BASE_URL="$VITE_API_BASE_URL_VAR"
          else
            echo "::warning::VITE_API_BASE_URL not set. Frontend will call relative /api paths in production."
          fi
          npm ci
          npm run build
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
